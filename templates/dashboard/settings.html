{% extends 'dashboard/base.html' %}
{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
    <a href="/dashboard/" class="btn btn-outline-secondary">← Back</a>
    <h2 class="mb-0">⚙️ Settings</h2>
</div>

{% if message %}
<div class="alert alert-success">{{ message }}</div>
{% endif %}

<div class="card border-0 shadow-sm p-4">
    <h5 class="mb-3">💰 Cost & Pricing Settings</h5>
    <form method="post">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label fw-bold">PKR to EUR Rate</label>
                <input type="number" step="0.01" class="form-control" name="pkr_to_eur" value="{{ settings.pkr_to_eur }}">
                <small class="text-muted">1 EUR = X PKR</small>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Freight Rate (PKR per KG)</label>
                <input type="number" step="0.01" class="form-control" name="freight_rate" value="{{ settings.freight_rate }}">
                <small class="text-muted">Auto-calculated: weight × rate ÷ 1000</small>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">eBay Commission (%)</label>
                <input type="number" step="0.01" class="form-control" name="commission" value="{{ settings.commission }}">
                <small class="text-muted">e.g. 25 = 25%</small>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Profit Margin (%)</label>
                <input type="number" step="0.01" class="form-control" name="profit_margin" value="{{ settings.profit_margin }}">
                <small class="text-muted">e.g. 100 = 100% profit (2x cost)</small>
            </div>
        </div>
        <button class="btn btn-success mt-3">💾 Save Settings</button>
    </form>
</div>
{% endblock %}
