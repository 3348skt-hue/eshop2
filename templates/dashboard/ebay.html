{% extends 'dashboard/base.html' %}
{% block content %}
<h2 class="mb-3">eBay Listings</h2>
<form class="d-flex mb-3 gap-2" method="get">
    <input class="form-control" name="q" value="{{ search }}" placeholder="Search by SKU, item ID, title...">
    <button class="btn btn-danger">Search</button>
    <a href="/dashboard/ebay/" class="btn btn-secondary">All</a>
</form>
<div class="table-responsive">
<table class="table table-striped table-hover table-sm">
    <thead class="table-dark">
        <tr><th>SKU</th><th>Item ID</th><th>Site</th><th>Price</th><th>Status</th><th>Title</th><th>Action</th></tr>
    </thead>
    <tbody>
    {% for l in listings %}
    <tr>
        <td>{{ l.1 }}</td>
        <td>{{ l.2 }}</td>
        <td>{{ l.3 }}</td>
        <td>{{ l.4 }}</td>
        <td><span class="badge bg-success">{{ l.5 }}</span></td>
        <td>{{ l.6 }}</td>
        <td>
            <button class="btn btn-sm btn-outline-danger" onclick="editListing({{ l.0 }}, {{ l.4 }})">Edit Price</button>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Update eBay Price</h5></div>
            <form method="post" id="editForm">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="mb-3">
                        <label>Price</label>
                        <input type="number" step="0.01" class="form-control" name="price" id="editPrice">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-danger">Update</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
function editListing(id, price) {
    document.getElementById('editPrice').value = price;
    document.getElementById('editForm').action = '/dashboard/ebay/update/' + id + '/';
    new bootstrap.Modal(document.getElementById('editModal')).show();
}
</script>
{% endblock %}
